<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links</title>
  <style>
    :root {
      --bg-start: #d9b98c;
      --bg-end: #c4a06f;
      --card-bg: #7a5c3e;
      --text: #f5f0e6;
      --muted: #8fa3a0;
      --border: #2c4a47;
      --link: #f0a868;
      --link-hover: #d98c47;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 380px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin: 14px 0;
    }

    a {
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--link);
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <ul>
      <li><a href="https://sigmasites.github.io/Flugzeug/" target="_blank" translate="no">Flugzeug</a></li>
      <li><a href="https://sigmasites.github.io/Maxs-3d-Shop/" target="_blank">Maxs 3d Shop</a></li>
      <li><a href="https://sigmasites.github.io/Clock/" target="_blank">Clock</a></li>
      <li><a href="https://sigmasites.github.io/Stundenplan/" target="_blank">Stundenplan</a></li>
      <!--<li><a href="https://sigmasites.github.io/3/" target="_blank">Zum Download der Dateien</a></li>--!>
      <li><a href="https://sigmasites.github.io/Rechner/" target="_blank">Rechner</a></li>
    </ul>
  </div>
</body>
    </html>
