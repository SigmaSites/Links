<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Meine GitHub Repositories</title>
</head>
<body>
    <h1>Meine Repositories</h1>
    <ul id="repo-list">Lade Repositories...</ul>

    <script>
        // Ersetzen Sie 'BENUTZERNAME' mit Ihrem echten GitHub-Namen
        const username = 'BENUTZERNAME'; 
        
        fetch(`https://github.com{username}/repos?sort=updated`)
            .then(response => response.json())
            .then(repos => {
                const list = document.getElementById('repo-list');
                list.innerHTML = ''; // Text zurücksetzen
                
                repos.forEach(repo => {
                    // Ignoriere Forks oder die eigene Profil-Webseite, falls gewünscht
                    if (!repo.fork) { 
                        const listItem = document.createElement('li');
                        listItem.innerHTML = `<a href="${repo.html_url}" target="_blank"><strong>${repo.name}</strong></a> - ${repo.description || 'Keine Beschreibung'}`;
                        list.appendChild(listItem);
                    }
                });
            })
            .catch(error => console.error('Fehler beim Laden:', error));
    </script>
</body>
</html>
